const setPage=p=>{state.page=p;state.filter='الكل';state.query='';location.hash=p;window.scrollTo(0,0);render()};
function notify(msg){let root=$('#toast-root');root.innerHTML=`<div class="toast">${escapeHTML(msg)}</div>`;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>root.innerHTML='',2800)}
function navButton(text,page){return `<button class="navbtn ${state.page===page?'active':''}" data-page="${page}">${text}</button>`}
function header(){return `<header class="topbar"><div class="container topinner"><a href="#home" class="brand" aria-label="مشكلجي"><span class="brand-icon">م</span>مشكلجي</a><nav class="navlinks">${navButton('الرئيسية','home')}${navButton('المسلسلات','series')}${navButton('الأفلام','movies')}${navButton('الوثائقيات','documentary')}${navButton('قائمتي','mylist')}</nav><div class="topactions"><button class="iconbtn" data-action="search" aria-label="بحث">⌕</button><button class="iconbtn" data-action="plans" aria-label="الاشتراكات" title="الاشتراكات">♛</button><button class="iconbtn" data-page="admin" aria-label="لوحة الإدارة" title="لوحة الإدارة">⚙</button><button class="profilepill" data-action="profiles" aria-label="تغيير الملف الشخصي"><span class="avatar">${escapeHTML(profile()?.icon||'م')}</span><span>${escapeHTML(profile()?.name||'ضيف')}⌄</span></button></div></div></header>`}
function bottomNav(){return `<nav class="bottomnav" aria-label="التنقل على الهاتف">${[['⌂','الرئيسية','home'],['▣','المسلسلات','series'],['⌕','بحث','search'],['♡','قائمتي','mylist'],['⚙','الإدارة','admin']].map(([ic,txt,page])=>`<button class="bottom-navitem ${state.page===page?'active':''}" data-page="${page}"><span>${ic}</span>${txt}</button>`).join('')}</nav>`}
function footer(){return `<footer><div class="container"><b style="color:#fff">مشكلجي <span class="accent">◀</span></b><span>© 2026 • نموذج استعراضي بمحتوى خيالي وأعمال فنية أصلية</span><button class="linkbtn" data-page="admin">لوحة الإدارة ⚙</button></div></footer>`}
function poster(x){const pct=progress(x.id);return `<article class="poster" data-open="${x.id}" tabindex="0" role="button" aria-label="تفاصيل ${escapeHTML(x.title)}"><div class="poster-art"><img alt="رسم توضيحي أصلي لعمل ${escapeHTML(x.title)}" loading="lazy" src="${x.uploadedCover||asset(x.cover+'.webp')}"><span class="poster-label">${typeLabel(x.type)}</span>${x.premium?'<span class="poster-vip">VIP</span>':''}<div class="poster-bottom"><strong>${escapeHTML(x.title)}</strong><small>${x.year} · ${escapeHTML(x.genre)}</small>${pct?`<div class="progress"><b style="width:${pct}%"></b></div>`:''}</div></div><div class="poster-under"><span>${escapeHTML(x.rating)} · ${escapeHTML(x.runtime)}</span><span class="little-heart">${liked(x.id)?'♥':'♡'}</span></div></article>`}
function rail(title,items,more=''){if(!items.length)return '';return `<section class="section"><div class="section-heading"><h2>${title}</h2>${more?`<button class="linkbtn" data-page="${more}">عرض الكل ←</button>`:''}</div><div class="rail">${items.map(poster).join('')}</div></section>`}
function hero(){const kids=profile()?.kids;const show=(kids?state.catalog.find(x=>x.id===11):state.catalog.find(x=>x.id===1))||visibleTitles()[0];if(!show)return '';return `<section class="hero"><div class="hero-bg" style="background-image:url('${asset(kids?'nour.webp':'hero.webp')}')"></div><div class="container hero-content"><div class="hero-kicker">مشكلجي تقدم · عرض حصري تجريبي</div><h1>${kids?'مغامرات <span>نور</span>':'آخر <span>محطة</span>'}</h1><div class="metadata"><span>★ اختيار المشاهدين</span><span>${show.year}</span><span class="tag">${escapeHTML(show.rating)}</span><span>الموسم الأول</span><span>${escapeHTML(show.genre)}</span></div><p>${escapeHTML(show.description)}</p><div class="btngroup"><button class="btn primary" data-watch="${show.id}">▶ شاهد العرض</button><button class="btn" data-open="${show.id}">ⓘ تفاصيل العمل</button><button class="btn ghost" data-fav="${show.id}">${liked(show.id)?'♥ في قائمتي':'+ قائمتي'}</button></div></div></section>`}
function chips(){const gs=['الكل','أكشن','دراما','كوميديا','تشويق','غموض','رومانسي','مغامرة','عائلي','طبيعة','علوم','خيال علمي'];return `<div class="genrechips">${gs.map(g=>`<button class="chip ${state.filter===g?'active':''}" data-filter="${g}">${g}</button>`).join('')}</div>`}
function home(){const titles=visibleTitles();const watched=titles.filter(x=>progress(x.id)>0);const picks=[...titles].sort((a,b)=>(b.views||0)-(a.views||0));return `${hero()}<div class="container content">${watched.length?rail('كمّل من مكان ما وقفت',watched):''}${rail('الأكثر مشاهدة على مشكلجي',picks.slice(0,10),'movies')}${rail('مسلسلات تستاهل السهرة',titles.filter(x=>x.type==='series').slice(0,8),'series')}<div class="banner"><div><h3>حكايات لكل بيت 🍿</h3><p>ملفات للعيلة، محتوى للأطفال، وباقات مرنة تناسبك.</p></div><button class="btn primary" data-action="plans">اكتشف الباقات</button></div>${rail('أفلام ومغامرات',titles.filter(x=>x.type==='movie').slice(0,9),'movies')}${rail('للأطفال والعيلة',titles.filter(x=>x.kids).slice(0,8),'kids')}</div>`}
function listingPage(){const names={series:'المسلسلات',movies:'الأفلام',documentary:'الوثائقيات',mylist:'قائمتي',kids:'عالم الأطفال',search:'ابحث عن حكايتك'};let a=visibleTitles();if(state.page==='series')a=a.filter(x=>x.type==='series');if(state.page==='movies')a=a.filter(x=>x.type==='movie');if(state.page==='documentary')a=a.filter(x=>x.type==='documentary');if(state.page==='mylist')a=a.filter(x=>liked(x.id));if(state.page==='kids')a=a.filter(x=>x.kids);if(state.filter!=='الكل')a=a.filter(x=>x.genre===state.filter);if(state.query.trim())a=a.filter(x=>(x.title+' '+x.genre+' '+x.description).toLowerCase().includes(state.query.toLowerCase().trim()));return `<div class="container"><div class="page-head"><span class="eyebrow">MASHKALGY · EXPLORE</span><h1>${names[state.page]||'استكشف'}</h1><p>اختار المحتوى اللي على مزاجك • ${a.length} عمل</p></div>${state.page==='search'?`<div class="searchbox" style="margin:16px 0 20px"><span>⌕</span><input id="search-input" autofocus autocomplete="off" placeholder="ابحث باسم الفيلم أو التصنيف..." value="${escapeHTML(state.query)}"></div>`:`<div class="chipsbar">${chips()}</div>`}<div class="gridcards" id="listing">${a.length?a.map(poster).join(''):`<div class="empty"><span class="symbol">✦</span>مفيش نتائج هنا دلوقتي<br>جرّب تصنيف تاني</div>`}</div></div>`}
function dashboard(){let views=state.catalog.reduce((s,x)=>s+(x.views||0),0);let series=state.catalog.filter(x=>x.type==='series').length;const sorted=[...state.catalog].sort((a,b)=>(b.views||0)-(a.views||0));return `<h1>نظرة عامة 👋</h1><div class="sub">ملخص بيانات تجريبية لمنصة مشكلجي — وليست إيرادات أو مستخدمين حقيقيين</div><div class="stats"><div class="stat"><small>الأعمال في الكتالوج</small><strong>${fmt(state.catalog.length)}</strong><em>↑ المحتوى قابل للإدارة</em></div><div class="stat"><small>المسلسلات</small><strong>${fmt(series)}</strong><em>محتوى عربي متنوع</em></div><div class="stat"><small>مرات المشاهدة (بيانات مثال)</small><strong>${fmt(views)}</strong><em>قيمة توضيحية فقط</em></div><div class="stat"><small>الاشتراكات النشطة (محاكاة)</small><strong>٢٬٤٨٠</strong><em>ليست متصلة بدفع حقيقي</em></div></div><div class="admin-panels"><section class="panel"><h3>الأكثر مشاهدة — بيانات توضيحية</h3>${sorted.slice(0,5).map(x=>`<div class="barrow"><span title="${escapeHTML(x.title)}">${escapeHTML(x.title)}</span><div class="bar-track"><div class="bar-fill" style="width:${(x.views||0)/Math.max(...sorted.map(x=>x.views||1))*100}%"></div></div><small>${fmt(x.views||0)}</small></div>`).join('')}</section><section class="panel"><h3>حالة التشغيل التجريبي</h3><p style="color:#b0b7c3;line-height:2">● كتالوج المحتوى: جاهز للتجربة<br>● ملفات المشاهدين: تخزين محلي<br>● تحكم الإدارة: محاكاة تفاعلية<br>○ المدفوعات الحقيقية: غير مفعّلة<br>○ حقوق العرض وDRM: غير مفعّلة<br>○ تطبيقات الهاتف والتلفزيون: غير منشورة</p><button class="btn small" data-admin="content">إدارة الكتالوج ←</button></section></div>`}
function adminContent(){return `<div class="admin-tools"><div><h1>مكتبة المحتوى</h1><div class="sub" style="margin:0">أضف أعمالًا، عدّل بياناتها، أو تحكم في نشرها</div></div><button class="btn primary small" data-action="add-title">＋ إضافة عمل</button></div><div class="panel table-wrap"><table class="datatable"><thead><tr><th>العمل</th><th>النوع</th><th>العام</th><th>التصنيف</th><th>الظهور</th><th>الإجراءات</th></tr></thead><tbody>${state.catalog.map(x=>`<tr><td><div class="table-title"><img src="${x.uploadedCover||asset(x.cover+'.webp')}" alt=""><span>${escapeHTML(x.title)}</span></div></td><td>${typeLabel(x.type)}</td><td>${x.year}</td><td>${escapeHTML(x.genre)}</td><td><span class="status ${x.published===false?'draft':''}">${x.published===false?'مسودة':'منشور'}</span></td><td><button class="mini-action" data-edit="${x.id}">تعديل</button><button class="mini-action" data-publish="${x.id}">${x.published===false?'نشر':'إخفاء'}</button><button class="mini-action" data-remove="${x.id}">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function adminUsers(){const names=['منى محمد','أحمد سامح','ليلى خالد','عمر علي','سارة حسن','ياسين فؤاد'];return `<h1>المشتركون</h1><div class="sub">بيانات حسابات افتراضية لعرض شكل لوحة الإدارة؛ لا توجد حسابات عملاء حقيقية</div><div class="panel table-wrap"><table class="datatable"><thead><tr><th>الاسم</th><th>البريد</th><th>الباقة</th><th>الحالة</th><th>تاريخ التسجيل</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td><b>${n}</b></td><td>demo${i+1}@example.test</td><td>${['عائلية','بريميوم','أساسية'][i%3]}</td><td><span class="status ${i===4?'draft':''}">${i===4?'معلقة':'نشطة'}</span></td><td>${(i+3)} نوفمبر 2026</td></tr>`).join('')}</tbody></table></div>`}
function adminPlans(){return `<div class="admin-tools"><div><h1>الاشتراكات والأسعار</h1><div class="sub" style="margin:0">أسعار مثال بالجنيه المصري قابلة للتعديل • لا يوجد دفع فعلي</div></div><button class="btn small" data-action="plans">معاينة الباقات</button></div><div class="plan-cards">${state.plans.map(p=>`<div class="plan-card ${p.id==='family'?'feature':''}"><h3>${escapeHTML(p.name)}</h3><div class="price">${fmt(p.price)} <small style="font-size:12px">ج.م / شهر</small></div><p>جودة ${p.quality} · ${p.screens} شاشة</p><button class="btn dark small" data-edit-plan="${p.id}">تعديل الباقة</button></div>`).join('')}</div>`}
function adminReports(){const views=state.catalog.reduce((sum,x)=>sum+(x.views||0),0);return `<h1>التقارير</h1><div class="sub">مؤشرات افتراضية لا تمثل حركة مشاهدة أو معاملات مالية فعلية</div><div class="stats"><div class="stat"><small>إجمالي مرات المشاهدة</small><strong>${fmt(views)}</strong></div><div class="stat"><small>متوسط الأعمال لكل نوع</small><strong>${(state.catalog.length/3).toFixed(1)}</strong></div><div class="stat"><small>الأعمال المميزة</small><strong>${state.catalog.filter(x=>x.premium).length}</strong></div><div class="stat"><small>الأعمال المخفية</small><strong>${state.catalog.filter(x=>x.published===false).length}</strong></div></div><div class="panel" style="margin-top:16px"><h3>تصدير الكتالوج</h3><p class="muted">احفظ بيانات المحتوى بصيغة JSON لاستخدامها مع قاعدة البيانات لاحقًا.</p><button class="btn primary small" data-action="export">↓ تنزيل ملف JSON</button></div>`}
function admin(){const tabs=[['overview','◫','الرئيسية'],['content','▦','إدارة الأفلام والمسلسلات'],['users','♧','المشتركون'],['plans','♛','الباقات والأسعار'],['reports','▤','التقارير']];let body={overview:dashboard,content:adminContent,users:adminUsers,plans:adminPlans,reports:adminReports}[state.adminTab]||dashboard;return `<div class="admin-layout"><aside class="admin-sidebar"><h3 class="admin-side-title">⚙ مركز تحكم مشكلجي</h3>${tabs.map(([id,icon,name])=>`<button class="admin-tab ${state.adminTab===id?'active':''}" data-admin="${id}">${icon} ${name}</button>`).join('')}<button class="admin-tab" data-page="home">↩ عرض المنصة</button></aside><div class="admin-main">${body()}</div></div>`}
function render(){let pg=state.page;document.title=(pg==='admin'?'لوحة الإدارة':'مشكلجي')+' — مشكلجي';$('#app').innerHTML=header()+`<main>${pg==='admin'?admin():pg==='home'?home():listingPage()}</main>`+footer()+bottomNav();if(pg==='search'){const input=$('#search-input');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}}
function modal(content,klass=''){let l=$('#layer-root');l.innerHTML=`<div class="overlay" id="modal-overlay"><section class="dialog ${klass}" role="dialog" aria-modal="true" aria-label="تفاصيل"><button class="close" data-action="close" aria-label="إغلاق">×</button>${content}</section></div>`;document.body.style.overflow='hidden'}
function closeModal(){let l=$('#layer-root');l.innerHTML='';document.body.style.overflow='';}
function details(id){const x=state.catalog.find(t=>t.id===+id);if(!x)return;const episodes=x.type==='series'?`<div style="margin-top:23px"><h3>الحلقات · الموسم الأول</h3>${Array.from({length:Math.min(parseInt(x.runtime)||8,8)},(_,i)=>`<div class="episode"><div class="episode-num">${i+1}</div><div style="flex:1"><b>الحلقة ${i+1} — ${i===0?'البداية':i===1?'الأسرار':'خيوط الحكاية'}</b><div><small>عرض توضيحي — ٤٥ دقيقة</small></div></div><button class="btn small dark" data-watch="${x.id}">▶</button></div>`).join('')}</div>`:'';modal(`<div class="details-banner" style="background-image:linear-gradient(0deg,#151a24,#0002),url('${x.uploadedCover||asset(x.cover+'.webp')}')"></div><div class="details-body"><span class="eyebrow">MASHKALGY ORIGINAL • ${x.premium?'VIP':'FREE'}</span><h2>${escapeHTML(x.title)}</h2><div class="metadata"><span>${x.year}</span><span class="tag">${escapeHTML(x.rating)}</span><span>${escapeHTML(x.genre)}</span><span>${escapeHTML(x.runtime)}</span></div><p>${escapeHTML(x.description)}</p><div class="btngroup"><button class="btn primary" data-watch="${x.id}">▶ مشاهدة العرض</button><button class="btn dark" data-fav="${x.id}">${liked(x.id)?'♥ إزالة من قائمتي':'+ أضف إلى قائمتي'}</button></div>${episodes}</div>`,'wide')}
function watch(id){const x=state.catalog.find(t=>t.id===+id);if(!x)return;closeModal();modal(`<div class="player-dialog"><video class="player-video" id="sample-player" controls playsinline preload="metadata" poster="${asset('hero.webp')}" src="${asset('sample.mp4')}">متصفحك لا يدعم تشغيل الفيديو.</video><div class="player-info"><b>${escapeHTML(x.title)}</b><button class="btn small dark" data-action="complete-video">حفظ التقدم وإغلاق</button></div><p class="player-note">مشهد رسوم متحركة أصلي قصير لأغراض العرض فقط — ليس الفيلم أو الحلقة الكاملة. تشغيل المحتوى الفعلي يتطلب ترخيص العرض وربط ملفات الفيديو.</p></div>`,'wide');const v=$('#sample-player');if(v){v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime>0){const pct=Math.min(95,Math.round(v.currentTime/v.duration*100));state.progress[key(x.id)]=pct;storeSave('progress',state.progress)}});v.play().catch(()=>{})}window.currentWatching=x.id}
function toggleFav(id){id=+id;let a=state.favorites[state.profileId]||[];state.favorites[state.profileId]=a.includes(id)?a.filter(x=>x!==id):[...a,id];storeSave('favorites',state.favorites);notify(a.includes(id)?'اتشال من قائمتك':'اتضاف لقائمتك ♥');if($('#modal-overlay'))details(id);render()}
function profilesModal(){modal(`<div class="dialog-body"><span class="eyebrow">WELCOME BACK</span><h2>مين بيتفرّج النهارده؟</h2><p>كل ملف له قائمته ومشاهداته الخاصة</p><div class="profile-grid">${state.profiles.map(p=>`<button class="profile-choice ${p.id===state.profileId?'selected':''}" data-profile="${p.id}"><span class="avatar">${escapeHTML(p.icon)}</span>${escapeHTML(p.name)}${p.kids?'<small>وضع الأطفال</small>':''}</button>`).join('')}</div><div class="field"><label>ملف جديد (حد أقصى ٥)</label><input id="new-profile" maxlength="20" placeholder="اسم الملف الشخصي" /></div><div class="rowline"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="profile-kids"> وضع الأطفال</label><button class="btn primary small" data-action="create-profile">إضافة ملف</button></div></div>`,'narrow')}
function plansModal(){modal(`<div class="dialog-body"><span class="eyebrow">CHOOSE YOUR PLAN</span><h2>الاشتراك على مزاجك</h2><p>الباقات والأسعار التالية افتراضية للمعاينة فقط — لن يُخصم أي مبلغ.</p><div class="plan-cards">${state.plans.map(p=>`<div class="plan-card ${p.id==='family'?'feature':''}"><h3>${escapeHTML(p.name)}</h3><div class="price">${fmt(p.price)} <small style="font-size:11px">ج.م / شهر</small></div><p>جودة ${escapeHTML(p.quality)}<br>${p.screens} شاشة في نفس الوقت<br>ملفات متعددة</p><button class="btn ${state.plan===p.id?'dark':'primary'} small" data-plan="${p.id}">${state.plan===p.id?'الباقة المختارة ✓':'اختيار الباقة'}</button></div>`).join('')}</div></div>`,'wide')}
function titleForm(id=null){const x=state.catalog.find(x=>x.id===+id)||{title:'',type:'movie',genre:'دراما',year:2026,rating:'13+',runtime:'1س 30د',description:'',premium:false,kids:false,cover:'last-station'};state.editing=id;modal(`<form id="title-form" class="dialog-body"><span class="eyebrow">CONTENT STUDIO</span><h2>${id?'تعديل العمل':'إضافة عمل جديد'}</h2><div class="formgrid"><div class="field"><label>اسم العمل</label><input name="title" required value="${escapeHTML(x.title)}"></div><div class="field"><label>النوع</label><select name="type"><option value="movie" ${x.type==='movie'?'selected':''}>فيلم</option><option value="series" ${x.type==='series'?'selected':''}>مسلسل</option><option value="documentary" ${x.type==='documentary'?'selected':''}>وثائقي</option></select></div><div class="field"><label>التصنيف</label><input name="genre" required value="${escapeHTML(x.genre)}"></div><div class="field"><label>سنة الإنتاج</label><input name="year" type="number" min="1900" max="2100" value="${x.year}"></div><div class="field"><label>التصنيف العمري</label><select name="rating"><option ${x.rating==='الكل'?'selected':''}>الكل</option><option ${x.rating==='13+'?'selected':''}>13+</option><option ${x.rating==='16+'?'selected':''}>16+</option><option ${x.rating==='18+'?'selected':''}>18+</option></select></div><div class="field"><label>المدة / عدد الحلقات</label><input name="runtime" value="${escapeHTML(x.runtime)}"></div></div><div class="field"><label>وصف العمل</label><textarea name="description" rows="3">${escapeHTML(x.description)}</textarea></div><div class="formgrid"><div class="field"><label>غلاف العمل (صورة محلية اختيارية)</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>غلاف تجريبي افتراضي</label><select name="cover">${initial.map(t=>`<option value="${t.cover}" ${x.cover===t.cover?'selected':''}>${escapeHTML(t.title)}</option>`).join('')}</select></div></div><div class="rowline" style="margin-bottom:20px;flex-wrap:wrap"><label><input type="checkbox" name="premium" ${x.premium?'checked':''}> مميز VIP</label><label><input type="checkbox" name="kids" ${x.kids?'checked':''}> مناسب للأطفال</label></div><button class="btn primary" type="submit">حفظ العمل</button></form>`,'wide')}
function planForm(id){const p=state.plans.find(x=>x.id===id);if(!p)return;modal(`<form class="dialog-body" id="plan-form"><h2>تعديل باقة ${escapeHTML(p.name)}</h2><input type="hidden" name="id" value="${p.id}"><div class="field"><label>السعر الشهري بالجنيه المصري</label><input name="price" required type="number" min="0" value="${p.price}"></div><div class="field"><label>عدد الشاشات</label><input name="screens" required type="number" min="1" max="20" value="${p.screens}"></div><div class="field"><label>الجودة</label><select name="quality">${['HD','Full HD','4K'].map(q=>`<option ${p.quality===q?'selected':''}>${q}</option>`).join('')}</select></div><button class="btn primary" type="submit">حفظ السعر</button></form>`,'narrow')}
function downloadJSON(){const blob=new Blob([JSON.stringify(state.catalog,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mashkalgy-catalog.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function fileToData(file){return new Promise((res,rej)=>{if(!file)return res(null);if(file.size>1.5*1024*1024)return rej(new Error('الصورة أكبر من 1.5 ميجابايت'));const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}
function listener(){document.addEventListener('click',e=>{const node=e.target.closest('[data-page],[data-action],[data-open],[data-watch],[data-fav],[data-profile],[data-plan],[data-filter],[data-admin],[data-edit],[data-publish],[data-remove],[data-edit-plan]');if(e.target.id==='modal-overlay'){closeModal();return}if(!node)return;if(node.matches('[data-open]')){details(node.dataset.open);return}if(node.matches('[data-watch]')){watch(node.dataset.watch);return}if(node.matches('[data-fav]')){toggleFav(node.dataset.fav);return}if(node.matches('[data-profile]')){state.profileId=+node.dataset.profile;storeSave('profileId',state.profileId);closeModal();state.page='home';render();notify('أهلًا '+profile().name);return}if(node.matches('[data-plan]')){state.plan=node.dataset.plan;storeSave('plan',state.plan);plansModal();notify('تم اختيار الباقة في المعاينة فقط');return}if(node.matches('[data-filter]')){state.filter=node.dataset.filter;render();return}if(node.matches('[data-page]')){setPage(node.dataset.page);closeModal();return}if(node.matches('[data-admin]')){state.adminTab=node.dataset.admin;render();return}if(node.matches('[data-edit]')){titleForm(node.dataset.edit);return}if(node.matches('[data-edit-plan]')){planForm(node.dataset.editPlan);return}if(node.matches('[data-publish]')){const x=state.catalog.find(t=>t.id===+node.dataset.publish);if(x){x.published=x.published===false?true:false;storeSave('catalog',state.catalog);render();notify(x.published?'تم نشر العمل':'تم إخفاء العمل')}return}if(node.matches('[data-remove]')){const x=state.catalog.find(t=>t.id===+node.dataset.remove);if(x&&confirm(`حذف «${x.title}» من النسخة التجريبية؟`)){state.catalog=state.catalog.filter(t=>t.id!==x.id);storeSave('catalog',state.catalog);render();notify('تم حذف العمل')}return}const action=node.dataset.action;if(action==='close'){closeModal();return}if(action==='search'){setPage('search');return}if(action==='profiles'){profilesModal();return}if(action==='plans'){plansModal();return}if(action==='add-title'){titleForm();return}if(action==='export'){downloadJSON();return}if(action==='complete-video'){const id=window.currentWatching;if(id){state.progress[key(id)]=Math.max(30,state.progress[key(id)]||0);storeSave('progress',state.progress)}closeModal();render();notify('تم حفظ مكان التوقف');return}if(action==='create-profile'){let name=$('#new-profile').value.trim();if(!name){notify('اكتب اسم الملف');return}if(state.profiles.length>=5){notify('الحد الأقصى ٥ ملفات');return}let kids=$('#profile-kids').checked;const p={id:Date.now(),name,kids,icon:kids?'★':name[0]};state.profiles.push(p);storeSave('profiles',state.profiles);profilesModal();notify('اتضاف ملف جديد');return}});
 document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.query=e.target.value;const titles=visibleTitles().filter(x=>(x.title+' '+x.genre+' '+x.description).toLowerCase().includes(state.query.toLowerCase().trim()));const list=$('#listing');if(list)list.innerHTML=titles.length?titles.map(poster).join(''):'<div class="empty">لا توجد نتائج مطابقة</div>';const sub=$('.page-head p');if(sub)sub.textContent=`${titles.length} نتيجة بحث`}});
 document.addEventListener('submit',async e=>{if(e.target.id==='title-form'){e.preventDefault();const fd=new FormData(e.target),id=state.editing;const prev=state.catalog.find(x=>x.id===+id);let cover=prev?.uploadedCover||null;try{cover=await fileToData(fd.get('image'))||cover}catch(err){notify(err.message);return}const item={...prev,id:prev?.id||Math.max(0,...state.catalog.map(x=>x.id))+1,title:fd.get('title').trim(),type:fd.get('type'),genre:fd.get('genre').trim(),year:+fd.get('year'),rating:fd.get('rating'),runtime:fd.get('runtime').trim(),description:fd.get('description').trim(),cover:fd.get('cover'),premium:fd.has('premium'),kids:fd.has('kids'),uploadedCover:cover,views:prev?.views||0,published:prev?.published!==false};if(prev)Object.assign(prev,item);else state.catalog.unshift(item);storeSave('catalog',state.catalog);closeModal();state.page='admin';state.adminTab='content';render();notify('تم حفظ بيانات العمل');return}if(e.target.id==='plan-form'){e.preventDefault();const fd=new FormData(e.target);const p=state.plans.find(x=>x.id===fd.get('id'));if(p){p.price=+fd.get('price');p.screens=+fd.get('screens');p.quality=fd.get('quality');storeSave('plans',state.plans)}closeModal();render();notify('تم تحديث بيانات الباقة');return}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.poster')){e.preventDefault();details(e.target.dataset.open)}});
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','series','movies','documentary','mylist','kids','search','admin'].includes(h)&&h!==state.page){state.page=h;render()}})}
state.page=['home','series','movies','documentary','mylist','kids','search','admin'].includes(location.hash.slice(1))?location.hash.slice(1):'home';listener();render();
})();
</script>
</body>
</html>
