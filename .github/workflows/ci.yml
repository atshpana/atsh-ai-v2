name: CI

on:
  pull_request:
  push:
    branches: [main, "implementation/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atsh_test
          POSTGRES_PASSWORD: atsh_test
          POSTGRES_DB: atsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atsh_test -d atsh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify runtime
        run: node --version && npm --version
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:validate --workspace @atsh/api
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:generate --workspace @atsh/api
      - name: Generate baseline migration preview (not applied)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: |
          mkdir -p prisma/migrations/0_init
          ../../node_modules/.bin/prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
          test -s prisma/migrations/0_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Apply baseline to isolated ephemeral PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://atsh_test:atsh_test@localhost:5432/atsh_test?schema=public
        run: |
          ../../node_modules/.bin/prisma migrate deploy
          ../../node_modules/.bin/prisma migrate status
      - name: Upload baseline migration preview for review
        uses: actions/upload-artifact@v4
        with:
          name: prisma-baseline-migration-preview
          path: apps/api/prisma/migrations/0_init/migration.sql
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
