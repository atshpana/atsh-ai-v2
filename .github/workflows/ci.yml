name: CI

on:
  pull_request:
  push:
    branches: [main, "implementation/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify runtime
        run: node --version && npm --version
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:validate --workspace @atsh/api
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:generate --workspace @atsh/api
      - name: Generate baseline migration preview (not applied)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: |
          mkdir -p prisma/migrations/0_init
          npm run db:baseline:preview > prisma/migrations/0_init/migration.sql
          test -s prisma/migrations/0_init/migration.sql
      - name: Upload baseline migration preview for review
        uses: actions/upload-artifact@v4
        with:
          name: prisma-baseline-migration-preview
          path: apps/api/prisma/migrations/0_init/migration.sql
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
