name: CI

on:
  pull_request:
  push:
    branches: [main, "implementation/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify runtime
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:validate --workspace @atsh/api
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://atsh_dev:placeholder@127.0.0.1:5432/atsh_ai_dev?schema=public
        run: npm run db:generate --workspace @atsh/api
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
