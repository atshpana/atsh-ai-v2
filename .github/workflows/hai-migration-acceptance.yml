name: HAI Migration Acceptance

on:
  pull_request:
  push:
    branches: [main, "implementation/**"]

permissions:
  contents: read

jobs:
  hai-migration-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hai_test
          POSTGRES_PASSWORD: hai_test_only
          POSTGRES_DB: hai_migration_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hai_test -d hai_migration_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://hai_test:placeholder@127.0.0.1:5432/hai_migration_acceptance?schema=public
        run: npm install
      - name: Apply migrations and verify immutable HAI audit tables
        env:
          HAI_MIGRATION_TEST_DATABASE_URL: postgresql://hai_test:hai_test_only@127.0.0.1:5432/hai_migration_acceptance
        run: node apps/api/scripts/test-hai-migration.mjs

